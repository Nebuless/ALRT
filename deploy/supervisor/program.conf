[program:nebuless-@SERVICE@]
command=@PYTHON@ @BASE@/current/deploy/service @BASE@ @SERVICE@
directory=@BASE@
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=75
umask=0077
stdout_logfile=@BASE@/state/logs/@SERVICE@.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
redirect_stderr=true
