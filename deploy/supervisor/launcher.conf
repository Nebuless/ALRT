; Optional platform-owned boot entry. The nested Supervisor and all app services
; run under the existing unprivileged identity, never the platform manager UID.
[program:nebuless-supervisor]
command=@SUPERVISORD@ -n -c @BASE@/supervisor.conf
user=@UID@
directory=@BASE@
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=@BASE@/state/logs/launcher.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
redirect_stderr=true
